# Netlify config for Receipts.
# Static site (no build step) + one serverless function for the live AI step.

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# (No catch-all redirect: Receipts is a single index.html, and a "/*" rewrite
#  could shadow the /.netlify/functions/write endpoint.)
